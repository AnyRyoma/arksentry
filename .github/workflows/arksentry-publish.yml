name: Publish ArkSentry Web

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/arksentry-web/**'
      - 'packages/arksentry-core/**'
      - 'package.json'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run build
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/arksentry-web/dist --project-name=${{ secrets.CLOUDFLARE_PAGES_PROJECT }} --branch=main
