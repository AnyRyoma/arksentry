name: Manual Cloudflare Pages Publish

# Production deploys automatically through Cloudflare Pages Git integration.
# Keep this workflow as an explicit fallback so pushes do not build and deploy twice.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run build
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/arksentry-web/dist --project-name=${{ secrets.CLOUDFLARE_PAGES_PROJECT }} --branch=main
