name: ArkSentry CI

on:
  pull_request:
    paths:
      - 'apps/arksentry-cli/**'
      - 'apps/arksentry-web/**'
      - 'packages/arksentry-core/**'
      - 'package.json'
  push:
    branches: [main]
    paths:
      - 'apps/arksentry-cli/**'
      - 'apps/arksentry-web/**'
      - 'packages/arksentry-core/**'
      - 'package.json'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: arksentry-web
          path: apps/arksentry-web/dist
          if-no-files-found: error
